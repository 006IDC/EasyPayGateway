name: Bug report
description: 报告可复现的插件问题；不要提交凭据或客户数据。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 提交前请删除商户密钥、真实域名、支付者信息、会话和完整日志。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 请填写 V10、PHP、MySQL 和主题版本。
      placeholder: V10 10.4.6, PHP 7.3, MySQL 5.7, default theme
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用脱敏数据说明最小复现过程。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: 脱敏确认
      options:
        - label: 我已删除密钥、真实域名、客户数据、会话和服务器凭据。
          required: true
