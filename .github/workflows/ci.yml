name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: PHP ${{ matrix.php }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '8.2', '8.4']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run contracts and redaction checks
        run: sh scripts/check.sh

  package:
    name: Reproducible package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          coverage: none
      - name: Build release archives
        run: sh scripts/build-release.sh
      - name: Verify SHA-256
        run: cd dist && sha256sum -c SHA256SUMS
