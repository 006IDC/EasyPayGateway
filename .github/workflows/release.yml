name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify and build release assets
        run: |
          sh scripts/build-release.sh
          unzip -tq dist/easy_pay_gateway_*.zip

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/easy_pay_gateway.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest install-package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/easy_pay_gateway_*.zip
          sbom-path: dist/easy_pay_gateway.spdx.json

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/easy_pay_gateway_*.zip
            dist/SHA256SUMS

      - name: Create draft and publish immutable GitHub release
        run: |
          gh release view "$RELEASE_REF" >/dev/null 2>&1 || \
            gh release create "$RELEASE_REF" --verify-tag --generate-notes --draft
          test "$(gh release view "$RELEASE_REF" --json isDraft --jq .isDraft)" = "true" || {
            echo "::error::Release $RELEASE_REF is already published and immutable."
            exit 1
          }
          gh release upload "$RELEASE_REF" dist/* --clobber
          gh release edit "$RELEASE_REF" --draft=false
